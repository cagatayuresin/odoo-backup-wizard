[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "odoo-backup-wizard"
version = "2.0.0"
description = "CLI tool to back up Odoo databases via the database manager API"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Cagatay URESIN", email = "cagatayuresin@gmail.com" }]
keywords = ["odoo", "backup", "postgresql", "cli", "database"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: System :: Archiving :: Backup",
]
requires-python = ">=3.10"
dependencies = ["requests>=2.31.0"]

[project.urls]
Homepage = "https://github.com/cagatayuresin/odoo-backup-wizard"
Repository = "https://github.com/cagatayuresin/odoo-backup-wizard"
"Bug Tracker" = "https://github.com/cagatayuresin/odoo-backup-wizard/issues"

[project.scripts]
odoo-backup-wizard = "odoo_backup_wizard.cli:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.4.4",
    "mypy>=1.10.0",
    "types-requests>=2.31.0",
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pre-commit>=3.7.0",
]

# ---------------------------------------------------------------------------
# Ruff — linter + formatter (replaces pylint, black, isort, flake8)
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["odoo_backup_wizard", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "S",   # flake8-bandit (security)
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "PTH", # flake8-use-pathlib
    "RUF", # ruff-specific rules
]
ignore = [
    "S101",  # asserts are fine in tests
    "S603",  # subprocess without shell=True — clear_screen pattern
    "B008",  # function calls in default args — argparse patterns
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101", # asserts expected in tests
    "S106", # hardcoded passwords in test fixtures
    "S108", # temp file usage in tests
]

[tool.ruff.lint.isort]
known-first-party = ["odoo_backup_wizard"]
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ---------------------------------------------------------------------------
# mypy — strict type checking
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_reexport = true
files = ["odoo_backup_wizard"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -v --strict-markers"
markers = [
    "integration: marks tests that require a live Odoo server",
    "slow: marks slow tests",
]

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------

[tool.coverage.run]
source = ["odoo_backup_wizard"]
branch = true
omit = ["odoo_backup_wizard/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
